    * { box-sizing: border-box; margin: 0; padding: 0; }

    header {
      background: linear-gradient(135deg, var(--emerald), var(--maroon));

      text-align: center;
      color: var(--emerald);
      font-size: 1.7rem;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }
    .card {
      background: #fff;
      border: 1px solid #e6dcc8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }
    .img-box {

      height: 260px;
      background: #f3ead8;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .price-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--maroon);
      color: var(--gold);
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid var(--gold);
    }
    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-body h3 {
      color: var(--maroon);
      font-size: 1.05rem;
      margin-bottom: 6px;
    }
    .card-body p {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 14px;

    .btn-wa {

      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
